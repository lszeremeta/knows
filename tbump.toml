# Uncomment this if your project is hosted on GitHub:
github_url = "https://github.com/lszeremeta/knows/"

[version]
current = "4.0.0.dev0"

# Semver regexp with an optional PEP 440 .devN suffix.
# Make sure this matches current_version before
# using tbump
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\.dev(?P<dev>\d+))?
  '''

# Release flow:
#   1. Release: tbump X.Y.Z (commits, tags vX.Y.Z -> triggers release workflow)
#   2. The release workflow then bumps main to X.Y+1.0.dev0 automatically
#      (reopen-development job), keeping `knows --version` on main honest
#      about being a pre-release. Manual fallback: tbump X.Y+1.0.dev0 --no-tag

[git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

# For each file to patch, add a [[file]] config
# section containing the path of the file, relative to the
# tbump.toml location.
[[file]]
src = "pyproject.toml"

[[file]]
src = "knows/__init__.py"

