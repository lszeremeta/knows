name: Create pre-release

on:
  push:
    branches:
      - "main"
  # Dispatched by the release workflow after the post-release version
  # bump (GITHUB_TOKEN pushes do not trigger push workflows).
  workflow_dispatch:

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Test with pytest
        run: |
          pytest
      - name: Run knows (help)
        run: |
          python -m knows --help

  pre-release:
    name: GitHub pre-release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the dev version stamp
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip" # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Stamp dev version from git
        # Give this build a unique PEP 440 dev version built from git state:
        # <next-version>.dev<commits-since-last-release-tag>+g<commit-hash>.
        # CI-only: nothing is committed.
        run: |
          STATIC=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" knows/__init__.py)
          if [[ "$STATIC" == *.dev* ]] && BASE_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
            N=$(git rev-list "${BASE_TAG}..HEAD" --count)
            HASH=$(git rev-parse --short=7 HEAD)
            STAMPED="${STATIC%%.dev*}.dev${N}+g${HASH}"
            sed -i "s/^__version__ = '.*'$/__version__ = '${STAMPED}'/" knows/__init__.py
            sed -i "s/^version = \".*\"$/version = \"${STAMPED}\"/" pyproject.toml
            echo "Stamped dev version: ${STAMPED}"
          else
            echo "Version ${STATIC} left as-is"
          fi
      - name: Build package
        run: python -m build
      - name: Delete latest tag
        run: gh release delete latest --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: true
          name: "Development Build"
          generate_release_notes: true
          files: |
            dist/*

  docker-hub:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the dev version stamp
      - name: Stamp dev version from git
        # Same stamp as in the pre-release job, so the :latest image
        # reports a unique dev version. CI-only: nothing is committed.
        run: |
          STATIC=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" knows/__init__.py)
          if [[ "$STATIC" == *.dev* ]] && BASE_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
            N=$(git rev-list "${BASE_TAG}..HEAD" --count)
            HASH=$(git rev-parse --short=7 HEAD)
            STAMPED="${STATIC%%.dev*}.dev${N}+g${HASH}"
            sed -i "s/^__version__ = '.*'$/__version__ = '${STAMPED}'/" knows/__init__.py
            sed -i "s/^version = \".*\"$/version = \"${STAMPED}\"/" pyproject.toml
            echo "Stamped dev version: ${STAMPED}"
          else
            echo "Version ${STATIC} left as-is"
          fi
      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=lszeremeta/knows
          VERSION=latest
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Update repo description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: lszeremeta/knows
